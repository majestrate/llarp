name: Build and publish a Docker image.

on:
  push:
    branches: ['release', 'dev']
    tags: "v*"
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      #
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Update submodules
        run: git submodule update --init --recursive
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      - name: Build base image
        id: base
        uses: docker/build-push-action@v5
        with:
          file: contrib/docker/Dockerfile.base
          context: .
          push: true
          tags: localhost:5000/llarp:base
      - name: Compile in docker container
        id: build
        uses: docker/build-push-action@v5
        with:
          file: contrib/docker/Dockerfile.build
          context: .
          push: true
          tags: localhost:5000/llarp:build
      - name: Assemble final docker image
        id: assemble
        uses: docker/build-push-action@v5
        with:
          file: contrib/docker/Dockerfile.final
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
